agents:
  agent_instance.1:
    type: instance
    models: [self.gemini_llm_for_adk]
    tools: [self._tools]
    params:
      name: self.root_agent.name
      description: self.root_agent.description
      instruction: [graph TD; A-->B;]
      class: TelegramBotAgent
      instance: agent.TelegramBotAgent.root_agent
  agent_instance.root_agent:
    type: instance
    models: [self.gemini_llm_for_adk]
    tools: [self._tools]
    params:
      name: TelegramBotAgent_Chat{self.chat_id}
      description: A conversational AI assistant for Telegram chats that can use tools for specific tasks like getting time,
        weather, chat history, generating speech, or creating images.
      instruction: [graph TD; A-->B;]
      class: TelegramBotAgent

models:
  self.gemini_llm_for_adk:
    type: literal
    agents: [agent_instance.root_agent, agent_instance.1]

tools:
  self._tools:
    type: function
    agents: [agent_instance.root_agent, agent_instance.1]
    params:
      dynamic: "True"

